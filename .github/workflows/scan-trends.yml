name: Scan TikTok trends

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan public TikTok photo posts
        run: npm run scan
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}

          SCAN_HOURS: "24"

          MAX_POSTS: "60"

          MAX_LINKS_PER_QUERY: "20"

          SCAN_QUERIES: ${{ vars.SCAN_QUERIES }}

      - name: Upload zero-result diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-scan-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3